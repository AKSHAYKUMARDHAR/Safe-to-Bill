name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate data and train the ML baseline
        run: |
          python -m safe_to_bill.generator
          python -m safe_to_bill.ml_baseline
      - name: Tests (offline; the LLM is faked)
        run: pytest -q
      - name: Re-score the dev set from cached model answers (no API key needed)
        run: python -m eval.run_eval --split dev --pipelines rules,ml,llm,llm1 --cache-only
      - name: Build the Docker image
        run: docker build -t safe-to-bill .
